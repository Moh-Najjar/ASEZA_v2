<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/aseza-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aseza</title>

    <!--
      Detect the saved theme preference BEFORE the stylesheet is parsed so the
      splash background never flickers.  Mirrors the logic in ThemeContext.tsx:
        1. localStorage  →  2. OS prefers-color-scheme  →  3. default (light)
    -->
    <script>
      (function () {
        var stored;
        try { stored = localStorage.getItem('theme-mode'); } catch (_) { /* ignore */ }
        var prefersDark =
          !stored &&
          typeof window !== 'undefined' &&
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || prefersDark) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <style>
      /* ── Reset ────────────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      /* ── Splash container ─────────────────────────────────────────────────── */
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Updated to new BRAND_PRIMARY (#0367A6) */
        background-color: #0367A6;
        z-index: 9999;
        transition: opacity 0.5s ease-in-out;
      }

      /* Darker variant for dark theme — mirrors background.default in dark theme */
      html[data-theme='dark'] #splash-screen {
        background-color: #024a78;
      }

      /* ── Centred brand mark + title ───────────────────────────────────────── */
      #splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: splashPulse 1.8s ease-in-out infinite;
      }

      #splash-logo-mark {
        width: 125px;
        height: 125px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: splashGlow 1.8s ease-in-out infinite;
      }

      #splash-logo-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      #splash-title {
        font-size: 22px;
        font-weight: 700;
        color: #ffffff;
        letter-spacing: 0.6px;
        font-family: 'Roboto', 'Helvetica', 'Arial', sans-serif;
      }
 
      /* ── Keyframes ────────────────────────────────────────────────────────── */

      /* Subtle scale pulse on the whole content block */
      @keyframes splashPulse {
        0%,  100% { opacity: 1;    transform: scale(1);    }
        50%        { opacity: 0.88; transform: scale(0.97); }
      }

      /* Expanding teal ring on the logo mark */
      @keyframes splashGlow {
        0%  { box-shadow: 0 0 0 0   rgba(20, 166, 151, 0); }
        70% { box-shadow: 0 0 0 16px rgba(20, 166, 151, 0);   }
        100%{ box-shadow: 0 0 0 0   rgba(20, 166, 151, 0);   }
      }

      /* Progress bar sweeps from 0 → 100 % */
      @keyframes splashBar {
        0%   { width: 0%;   }
        60%  { width: 75%;  }
        100% { width: 100%; }
      }

      /* Triggered by main.tsx before the element is removed from the DOM */
      .fade-out {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Splash is rendered before React mounts and removed by main.tsx -->
    <div id="splash-screen">
      <div id="splash-content">
        <div id="splash-logo-mark">
          <img src="/src/assets/aseza-icon.svg" alt="ASEZA Logo" />
        </div>
        <span id="splash-title">ASEZA Portal</span>
      </div>
      <div id="splash-bar"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
